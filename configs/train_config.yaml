# Default configuration for LMVF training

# Model settings
model: "Qwen2.5-0.5B-Instruct"
verifier_model: "deepseek-r1-distill-qwen-1.5b"
strict_verifier_model: "Qwen2.5-3B-Instruct"

# Other settings
seed: 42
gpus_per_node: 1
num_nodes: 2 # Total number of nodes for training + generation (not verifier)

verifier_nodes: 1
strict_verifier_nodes: 1

# Dataset settings
dataset: "math"

# Generation settings
num_generations: 4

# Training settings
per_device_train_batch_size: 2 # default: 8
max_steps: 10
logging_steps: 10
save_steps: 10
save_total_limit: 5 # save 5 checkpoints
max_prompt_length: 8192


verbose: false

# Output settings
output_base_path: "/n/netscratch/hankyang_lab/Lab/alex/LMVF"