# Default configuration for LMVF training

# Model settings
model: "gemma-3-1b-it"
verifier_model: "deepseek-r1-distill-qwen-1.5b"
strict_verifier_model: "gemma-3-4b-it"

# Other settings
seed: 42
gpus_per_node: 1
num_nodes: 2

train_nodes: 1
vllm_nodes: 1


# Dataset settings
dataset: "math"

# Generation settings
num_generations: 8
batch_size: 64
verifier_batch_size: 16

# Evaluation settings
eval_mode: 
    - "pass@1"
    - "pass@8"
    - "bon-mav"
verbose: false

# Output settings
output_base_path: "/n/netscratch/hankyang_lab/Lab/alex/LMVF"