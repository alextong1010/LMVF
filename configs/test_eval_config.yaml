# Default configuration for LMVF evaluation

# Model settings
model: "gemma-3-1b-it"  # Main model for generation
verifier_model: "gemma-3-4b-it"     # Optional separate model for verification (uses main model if null)

# Other settings
seed: 42
gpus_per_node: 2
num_nodes: 1
verifier_model_gpus_per_node: 1  # Number of GPUs per node for verifier model
verifier_model_num_nodes: 1      # Number of nodes for verifier model

# Dataset settings
dataset: "math"

# Generation settings
num_generations: 4
batch_size: 8

# Evaluation settings
eval_mode: 
    - "pass@1"
    - "pass@4"
    - "bon-mav"
verbose: false

# Output settings
output_dir: null  # Will be auto-generated if not provided
output_base_path: "/n/netscratch/hankyang_lab/Lab/alex/LMVF"

