# Default configuration for LMVF evaluation

# Model settings
model: "gemma-3-1b-it"  # Main model for generation
verifier_model: null     # Optional separate model for verification (uses main model if null)

# Other settings
seed: 42
gpus_per_node: 1
num_nodes: 1

# Dataset settings
dataset: "math"

# Generation settings
num_generations: 2
batch_size: 2
verifier_batch_size: 2

# Evaluation settings
eval_mode: 
    - "pass@1"
    - "pass@2"
    - "bon-mav"
verbose: false

# Output settings
output_base_path: "/n/netscratch/hankyang_lab/Lab/alex/LMVF"
