# Default configuration for LMVF generation

# Model settings - can be a single model or list of models

# Base configuration - shared across all evaluations
base_config:
  models:
    - "gemma-3-1b-it" # trial 2
    - "Qwen2.5-0.5B-Instruct" # trial 1
    - "Qwen2.5-1.5B-Instruct" # trial 1
    - "Qwen2.5-3B-Instruct" # trial 1
    - "Qwen2-0.5B-Instruct" # trial 2

  verifier_models:
    # - "Qwen2.5-3B-Instruct"
    # - "deepseek-r1-distill-qwen-1.5b"
    - "Qwen2.5-0.5B-Instruct"
    - "Qwen2.5-1.5B-Instruct"

  strict_verifier_models:
    - "Qwen2.5-3B-Instruct"
    - "Qwen2.5-0.5B-Instruct"
    - "Qwen2.5-1.5B-Instruct"

  seed: 42
  gpus_per_node: 1 # Ignored if running straight from the python script
  num_nodes: 2 # Ignored if running straight from the python script

  dataset: "math_500"

  num_generations: 8
  batch_size: 64
  output_base_path: "/n/netscratch/ydu_lab/Lab/alex/LMVF"
  gen_seed: 0
  solutions_file_name: "task_{task_id}_solutions.json"
  verbose: false