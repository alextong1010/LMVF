# Base configuration - shared across all evaluations
base_config:
  models:
    - "Qwen2.5-0.5B-Instruct"
    - "Qwen2.5-1.5B-Instruct" 
    - "Qwen2.5-3B-Instruct"
    # - "Qwen2.5-7B-Instruct"
    # - "Phi-3-mini-128k-instruct"
    # - "Qwen2.5-0.5B-Instruct"
    # - "gemma-3-1b-it"

  verifier_model: "deepseek-r1-distill-qwen-1.5b"

  strict_verifier_model: "Qwen2.5-3B-Instruct"

  recomb_model: "Qwen2.5-0.5B-Instruct"
  
  solutions_dir: "/n/netscratch/ydu_lab/Lab/alex/LMVF/math_500/gen"
  solutions_file_name: "task_{task_id}_solutions_trial_4_with_solution_in_prompt.json"
  # solutions_file_name: "task_{task_id}_solutions.json"

  dataset: "math_500"
  seed: 42
  gpus_per_node: 1 # Ignored if running straight from the python script
  num_nodes: 2 # Ignored if running straight from the python script
  batch_size: 32
  output_base_path: "/n/netscratch/ydu_lab/Lab/alex/LMVF"
  verbose: false

# Evaluation scenarios to run consecutively
eval_scenarios:
  - name: "individual_pass@1"
    description: "Pass@1 for each model individually"
    eval_mode: "pass@1"
    mode: "individual"
    model_subset: "all"
    generations_per_model: 1

  - name: "individual_pass@2"
    description: "Pass@2 for each model individually"
    eval_mode: "pass@2"
    mode: "individual"
    model_subset: "all"
    generations_per_model: 2
    
  - name: "individual_pass@4"
    description: "Pass@4 for each model individually"
    eval_mode: "pass@4"
    mode: "individual"
    model_subset: "all"
    generations_per_model: 4

